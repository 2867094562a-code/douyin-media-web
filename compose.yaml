services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      PORT: "8000"
    shm_size: 256mb
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No media volume: all downloads are streamed directly to the client.
