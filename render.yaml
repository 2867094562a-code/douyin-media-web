services:
  - type: web
    name: shiying-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: API_KEY
        generateValue: true
      - key: MAX_CONCURRENT_PARSES
        value: "1"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "1"
      - key: MAX_IN_MEMORY_JOBS
        value: "10"
